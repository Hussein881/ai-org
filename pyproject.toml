[project]
name = "aiorg"
version = "0.0.0"
description = "AI Organization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest-asyncio>=1.5.0",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
extend-exclude = [".claude", "skills", "web"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"app/api/**" = ["B008"]
"app/cli.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.gateway.*", "app.policy.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
