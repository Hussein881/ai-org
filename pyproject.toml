[project]
name = "aiorg"
version = "0.0.0"
description = "AI Organization"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[tool.ruff]
line-length = 100
extend-exclude = [".claude", "skills", "web"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.gateway.*", "app.policy.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
